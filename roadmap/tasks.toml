[[task]]
id = 57
phase = 12
bundle = "rpc_shapes"
status = "pending"
title = "Unify get_block_* / get_transaction_* RPC return shapes"
module = "Onchain.RPC"
scores = { d = 4, b = 6, u = 6 }
assignee = "claude"
model = "claude-sonnet-4-6"
domains = ["rpc"]
created_at = "2026-04-23"
scored_at = "2026-04-23"
body = """
get_transaction_by_hash/2 returns an atom-keyed struct with integers decoded; get_block_by_number/2 returns a raw string-keyed map with hex-string values. Callers must remember which returns which, and the second shape forces manual String.to_integer/2. Pick one: both decode to atom-keyed structs (Onchain.Block.t() / Onchain.Transaction.t()), or both surface raw string-keyed maps. Leaning toward decoded structs — matches the Phase 8 transfer-parser direction and the Onchain.Transfer pattern. Breaking change for get_block_by_number/2 consumers; justify with a minor-version bump and a CHANGELOG migration note.
"""
acceptance_criteria = [
  "Both get_block_* and get_transaction_* return the same shape family (decoded structs OR raw maps — one choice, documented)",
  "Breaking change noted in CHANGELOG with a migration snippet",
  "Existing callers and tests updated; suite green",
]

[[task]]
id = 63
phase = 12
bundle = "rpc_codegen"
status = "pending"
title = "defrpc macro — codegen named JSON-RPC wrappers from declarative specs"
module = "Onchain.RPC"
scores = { d = 4, b = 6, u = 5 }
assignee = "claude"
model = "claude-opus-4-8"
domains = ["rpc", "macros"]
created_at = "2026-04-23"
scored_at = "2026-04-23"
body = """
The 11 existing Onchain.RPC.* wrappers follow a near-identical shape: per-arg validation + param construction + do_rpc(method, params, to_signet_opts(opts)) + an identical bang variant + a Descripex api() annotation. A defrpc macro expands a declaration like `defrpc :block_number, \"eth_blockNumber\", decode: :hex_unsigned, description: \"...\"` into the full function + bang + api() + @spec. Precedents that disprove the macros-are-scary objection: Phoenix.Router, Ecto.Schema, Absinthe.Schema — defrpc faces strictly less variance. The knob-growth failure mode is solved by NimbleOptions: the validate!/2 schema IS the macro's contract; adding a knob requires changing the schema, making drift visible. Variance to handle: per-arg validators, nested-map params, literal extra params, filter-key whitelist (eth_get_logs), :decode pass-through, descripex returns: variation. If a case doesn't fit, follow Ecto and add a sibling macro (defrpc_with_filter) rather than overloading defrpc.
"""
acceptance_criteria = [
  "Macro lives in Onchain.RPC (or a private helper module); NimbleOptions schema documents the public contract",
  "Existing 11 wrappers reimplemented through it with byte-identical public behavior (returns, error shapes, descripex hints, dialyzer story unchanged)",
  "Test suite green without changes; CHANGELOG entry explains the refactor and notes no API change",
  "Kill the prototype if the option schema balloons past ~10 keys or 3+ wrappers need bespoke escape hatches",
]

