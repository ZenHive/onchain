body = """
The pending map has a per-key cap of 100 but an unbounded distinct-keys count. A server emitting notifications for never-subscribed sub_ids grows the key set until the connection closes (per-connection Agent dies with the conn, so blast radius is bounded — but worth fixing). Fix: buffer only sub_ids in an in-flight subscribe state, or add a global key cap with eviction. Well-bounded hardening on an existing module. Include a test exercising the unsolicited-sub_id path.
"""

[[task]]
id = 74
phase = 12
bundle = "erc_standards"
status = "pending"
title = "ERC-7730 clear-signing descriptor parser + binding evaluator"
module = "Onchain.ERC7730"
scores = { d = 6, b = 7, u = 6 }
markers = ["parallel"]
assignee = "claude"
model = "claude-opus-4-8"
domains = ["abi", "erc_standards"]
created_at = "2026-05-07"
scored_at = "2026-05-07"
body = """
ERC-7730 (eips.ethereum.org/EIPS/eip-7730) standardizes a JSON descriptor that binds calldata / EIP-712 typed messages / ERC-4337 UserOps to human-readable display rules. Three pieces (pure Elixir, no native deps): (1) descriptor loader/validator — parse the JSON schema, validate structural rules; (2) binding evaluator — given {chain_id, contract_address, calldata} (or EIP-712 payload, or UserOp), resolve which descriptor applies via the binding context (chain ID, address, EIP-712 domain separator, proxy detection); (3) display rule engine — apply field formatters (token amount w/ decimals, address w/ checksum/ENS, date, enum, interpolated strings) to decoded ABI/EIP-712 fields, producing {label, value, formatted_value}. Deps already in onchain: ABI decoding, EIP-712 hashing (Cartouche), ERC-20 metadata, Address checksum, proxy detection. Registry side (fetching curated descriptors from Ledger's repo/IPFS/CDN) stays OUT — start with caller-provided descriptors. Module layout: lib/onchain/erc7730.ex (load/1, format/2, format!/2) + descriptor.ex / binding.ex / formatter.ex. First pass covers common formatters; defer rare ones (NFT URI, recursive sub-message). Survey how Ledger/Uniswap reference impls handle proxy detection before implementing.
"""
acceptance_criteria = [
  "Onchain.ERC7730.load/1 accepts a JSON string or Path; returns {:ok, descriptor} / {:error, {tag, reason}}",
  "Onchain.ERC7730.format/2 takes a descriptor + {:calldata, address, chain_id, hex_data} (or {:eip712, payload}, {:user_op, ...}); returns {:ok, [%{label, value, formatted_value, raw}]} or {:error, {tag, reason}}",
  "Fixtures: a descriptor each for ERC-20 transfer, a Uniswap V3 router call, an EIP-712 permit message",
  "All public functions have Descripex api() annotations + @spec; unit tests for parser/binding/each formatter + one integration test against real calldata",
]
