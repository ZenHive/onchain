body = """
Unit tests don't catch protocol-level mistakes: wrong param ordering vs spec, wrong map-param nesting, wrong block-tag handling (safe/finalized/earliest), wrong response decoding for sparse fields. A differential harness runs the same RPC method against the same node via Onchain.RPC AND a reference implementation, then asserts equality. Reference candidates by cost: (1) signet itself — already in deps, pure Elixir, zero new infra, weakest oracle but cheapest, do first; (2) Web3.py via external Python; (3) viem via elixir-volt. Scope: test/onchain/differential/, @tag :differential, gated behind an env var, runs against ETHEREUM_API_URL. Pick ~10 methods covering map-param construction, block-tag variance, and decoding edge cases. Defer 65b/65c (Web3.py, viem) until signet-as-oracle finds >=1 bug.
"""
acceptance_criteria = [
  "Harness runs >=10 methods against signet as oracle",
  "Documents any divergences as either Onchain bugs (fix) or signet differences (annotate)",
  "Gated behind env var + @tag :differential so the default suite is unaffected",
]

