schema_version = 2
project = "onchain"
default_branch = "development"
vision = "Pure Elixir Ethereum library — read + write primitives, no native deps. RPC method wrappers, ABI encode/decode, signing, token reads/writes, chain-intelligence primitives, and real-time subscriptions over Cartouche's public surface. Core of the five-package onchain family (onchain, onchain_aave, onchain_evm, onchain_js, onchain_tempo). Completed work lives in CHANGELOG.md; this file tracks the actionable pending backlog harness dispatches."

# ----------------------------------------------------------------------------
# Phases — only those carrying pending work (completed phases live in CHANGELOG)
# ----------------------------------------------------------------------------

[phases.7]
name = "DEX Infrastructure"
order = 7
status = "pending"

[phases.9]
name = "Account Abstraction (ERC-4337)"
order = 9
status = "pending"

[phases.10]
name = "RPC Composition Layer"
order = 10
status = "pending"

[phases.12]
name = "Code Health"
order = 12
status = "pending"

# ----------------------------------------------------------------------------
# Bundles
# ----------------------------------------------------------------------------

[bundles.dex]
phase = 7
order = 1
description = "On-chain DEX trading support: swap routing across liquidity pools and MEV protection."

[bundles.account_abstraction]
phase = 9
order = 1
description = "ERC-4337 UserOperation construction, signing, and bundler RPC."

[bundles.rpc_composition]
phase = 10
order = 1
description = "RPC method wrappers, observability facades, and helpers over Cartouche structs — small, batchable, no consumer blocking."

[bundles.rpc_shapes]
phase = 12
order = 1
description = "Unify RPC return-shape inconsistencies (decoded structs vs raw hex maps)."

[bundles.rpc_codegen]
phase = 12
order = 2
description = "defrpc macro + OpenRPC/Erigon spec vendoring to codegen named JSON-RPC wrappers."

[bundles.ens]
phase = 12
order = 3
description = "ENS resolution enhancements: CCIP-Read, ENSIP-10 wildcard, UTS-46 normalization, multi-coin."

[bundles.differential_testing]
phase = 12
order = 4
description = "Differential test harness comparing Onchain.RPC against reference implementations."

[bundles.subscription_hardening]
phase = 12
order = 5
description = "Harden Onchain.Subscription against unsolicited sub_id key growth."

[bundles.erc_standards]
phase = 12
order = 6
description = "ERC standard parsers/evaluators (ERC-7730 clear-signing descriptors)."

