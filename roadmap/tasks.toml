[[task]]
id = 70
phase = 12
bundle = "subscription_hardening"
status = "done"
title = "Harden Onchain.Subscription.lookup_or_buffer/3 against unsolicited sub_id keys"
scores = { d = 3, b = 4, u = 3 }
markers = ["parallel"]
domains = ["subscription"]
assignee = "cursor"
module = "Onchain.Subscription"
body = """
The pending map has a per-key cap of 100 but an unbounded distinct-keys count. A server emitting notifications for never-subscribed sub_ids grows the key set until the connection closes (per-connection Agent dies with the conn, so blast radius is bounded — but worth fixing). Fix: buffer only sub_ids in an in-flight subscribe state, or add a global key cap with eviction. Well-bounded hardening on an existing module. Include a test exercising the unsolicited-sub_id path.
"""
implemented = "Onchain.Subscription.lookup_or_buffer/3 now bounds the distinct pending sub_id key count with @max_pending_distinct_sub_ids (16): a never-before-seen sub_id is buffered only while map_size(pending) < cap, otherwise the oldest key is evicted (with a warning log) before insert. Existing keys still honor the per-key @max_pending_per_sub_id (100) cap. Tests in subscription_test.exs exercise the unsolicited-sub_id eviction path."
delivered_by = "cursor"
verified = true
created_at = "2026-05-07"
started_at = "2026-06-05"
